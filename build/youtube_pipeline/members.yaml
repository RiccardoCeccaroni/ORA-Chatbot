# ORA party members — used to filter speakers during YouTube transcript distillation.
#
# Source: https://ora-italia.it/partito/   (fetched 2026-05-15, supplied by Riccardo)
# Bodies covered: Segretario, Presidente, Segreteria Nazionale,
#                 Segreteria Presidente, Consiglio Direttivo, Assemblea Nazionale.
#
# Filter rule for distillation:
#   - A claim is extracted as party voice IFF the speaker matches an entry in
#     `members` (by name, with light fuzzy matching for spelling variants).
#   - External experts not in this list (Cassese, Sesta, Bizzarri, Molteni,
#     Skeptical Health, etc.) get their claims dropped — even when they speak
#     in an ORA-channel video. The ORA member's replies in those dialogues
#     are still extractable.
#
# Body abbreviations used throughout: SN = Segreteria Nazionale,
# SP = Segreteria Presidente, CD = Consiglio Direttivo, AN = Assemblea Nazionale.

